<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#6345e3" />
    <meta name="theme-color" content="#6366f1" />
    <!-- iOS "Add to Home Screen" standalone support (status bar style + home-screen
         title). Modern iOS (16.4+) also reads the web manifest; these cover older iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FormLogic" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves to real values on
         notched phones — the mobile nav/FAB safe-area padding relies on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Turn forms into connected apps, dashboards and automations — cloud or self-hosted. Add FormLogic Desktop for local AI, devices and headless flows, including Aokie, your AI phone receptionist." />
    <title>FormLogic — Build the system that runs your business</title>

    <!-- Open Graph / Twitter card so shared links render a branded preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FormLogic" />
    <meta property="og:title" content="FormLogic — Build the system that runs your business" />
    <meta property="og:description" content="Turn forms into connected apps, dashboards and automations — cloud or self-hosted. Add FormLogic Desktop for local AI, devices and headless flows, including Aokie, your AI phone receptionist." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FormLogic — Build the system that runs your business" />
    <meta name="twitter:description" content="Turn forms into connected apps, dashboards and automations — cloud or self-hosted. Add FormLogic Desktop for local AI, devices and headless flows, including Aokie, your AI phone receptionist." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: load non-render-blocking (preload as style, then main.tsx promotes
         to stylesheet — an inline onload handler would violate the app-shell CSP,
         which has no 'unsafe-inline'/'unsafe-hashes' for scripts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" data-fl-font-promote href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
