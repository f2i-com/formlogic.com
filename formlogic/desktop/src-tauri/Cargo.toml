[package]
name = "formlogic-desktop"
version = "0.1.0"
description = "Tray-resident desktop companion for formlogic-web. Manages local AI services + browser automation, exposes them to the web flow editor via a localhost API."
authors = ["FormLogic"]
edition = "2021"
rust-version = "1.88"
# The crate ships two binaries now (the GUI companion + the headless formlogic-server),
# so `cargo run` / `tauri dev` would be ambiguous without naming the default.
default-run = "formlogic-desktop"

[lib]
name = "formlogic_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The crate builds two binaries from one shared lib:
#   formlogic-desktop — the Tauri GUI (needs the `gui` feature → tauri/webkit2gtk)
#   formlogic-server    — headless HTTP API (no GUI deps when built --no-default-features)
[features]
default = ["gui"]
gui = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-autostart",
    "dep:tauri-build",
]

[[bin]]
name = "formlogic-desktop"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "formlogic-server"
path = "src/bin/formlogic-server.rs"

# Protocol-complete mock plugin (init/health/shutdown, echo.ping connector,
# mock.tick events). Built for the plugin-host integration tests
# (tests/plugin_host.rs copies it into a temp plugin dir via
# CARGO_BIN_EXE_mock-plugin) and handy for manual poking.
[[bin]]
name = "mock-plugin"
path = "src/bin/mock-plugin.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [], optional = true }

[dependencies]
# Tauri 2.x with tray-icon support — GUI only, so optional behind `gui`.
tauri = { version = "2.1", features = ["tray-icon"], optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
# Native folder picker for "choose where models/services live".
tauri-plugin-dialog = { version = "2.0", optional = true }
# Native OS notifications so a download/install finishing reaches the user
# even when the companion window is hidden to the tray.
tauri-plugin-notification = { version = "2.0", optional = true }
# Launch FormLogic Desktop on login so the flow runtime + connector relay are
# always available for remote/web-driven control (registry Run key on Windows).
tauri-plugin-autostart = { version = "2.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime + HTTP server. axum is the small, focused choice — we
# don't need the heavier alternatives. tower-http gives us the CORS
# layer that lets a hosted formlogic-web at any origin reach the companion.
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Logging through Tauri's standard mechanism so logs flow into the
# companion's own console + (later) the LogsViewer UI.
log = "0.4"

# Timestamps on log lines + ServiceRuntime.last_status_change so the UI
# can show "started 3m ago" without round-tripping system time across
# the JSON boundary as strings.
chrono = { version = "0.4", features = ["serde"] }

# HTTP client for model downloads. rustls (not native-tls) keeps the
# Windows build self-contained — no schannel ABI surprises and no
# OpenSSL on Linux. `stream` is needed for incremental progress so the
# UI can show "1.2 GB / 4.7 GB · 38 MB/s" instead of a frozen bar.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking", "json", "multipart"] }
futures-util = "0.3"
# Native outbound signalling for the optional Aokie Companion publisher. The
# bearer credential stays in this Rust process; it is never handed to the
# Tauri webview. Remote deployments require rustls-backed WSS.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

# Native python-build-standalone install: gunzip + untar the PBS release
# in-process, so installing Python needs no PowerShell / tar.exe / .ps1.
flate2 = "1"
tar = "0.4"

# UUIDs for download / install job IDs. v4 only — no need for the
# timestamp/MAC variants.
uuid = { version = "1", features = ["v4"] }

# URL parsing for the HuggingFace `huggingface.co/<repo>/blob/...`
# → `/resolve/...` rewrite so users can paste either flavour.
url = "2"

# Cross-platform free-disk-space query, for the pre-download space check
# (refuse a 40 GB model before filling the drive) + the "X free" readout
# in the Models tab.
fs2 = "0.4"

# Pairing tokens (plugin host): tokens are stored SHA-256-hashed (never
# plaintext) and generated from OS randomness. Both crates are already in
# the tree transitively, so this adds no new build surface.
sha2 = "0.10"
getrandom = "0.2"

# DATA-PRIV-001: at-rest encryption for the operational journals (event
# receipts + work ledger), which carry transcript/SMS/caller payloads. AEAD
# with a per-install data key held in the OS credential store.
chacha20poly1305 = "0.10"

# TRUST-001: verification of first-party-signed plugin package manifests
# (pinned publisher keys; signature + per-file digest checks before staging
# and again before launch; tampered packages quarantine).
ed25519-dalek = { version = "2", features = ["signature"] }
base64 = "0.22"

# Site-AI desktop tunnel (docs/SITE_AI_CHAT_DESKTOP_TUNNEL_PLAN.md §5.1):
# end-to-end envelopes between the browser (tweetnacl `box`) and this host —
# X25519 ECDH → HSalsa20 → XSalsa20-Poly1305, guaranteed tweetnacl interop.
crypto_box = "0.9"

# Encrypted data nodes (docs/FORMLOGIC_DATA_NODES.md §4-§5): SQLCipher-encrypted
# per-dataset SQLite stores. The vendored-OpenSSL flavour keeps the build
# hermetic (no system OpenSSL), at the cost of needing a native Perl
# (Strawberry Perl on Windows + the Text::Template module) at BUILD time only.
# There is deliberately NO plain-SQLite fallback feature (plan D17).
rusqlite = { version = "0.31", features = ["bundled-sqlcipher-vendored-openssl"] }

# Aokie Companion owner pairing payloads are rendered locally as QR SVGs.
# The payload contains only public identity/binding material and a one-use
# challenge; no admission/API bearer is ever encoded in the QR.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# PLG-102: extraction of .formlogic-plugin archives (internally a ZIP) during
# UI-driven install. `deflate` only (no bzip2/zstd/native-tls surface); the
# extractor enforces its own file-count / size / compression-ratio / traversal
# / symlink guards on top of the crate (see plugins/install.rs).
zip = { version = "2", default-features = false, features = ["deflate"] }

# DESK-SECRET-001: the OS credential store (Windows Credential Manager) for the
# long-lived FormLogic API key + HuggingFace token, so they never sit in a
# plaintext config file. Windows-only backend — the audited/shipped platform;
# other targets fall back to the existing plaintext storage (see src/secrets.rs).
#
# DESK-PROC-001: Job Object (kill-on-close) so the whole service tree dies with
# the desktop, and SetHandleInformation to make the API listener socket
# non-inheritable so children never wedge :17872 (see src/proc.rs).
#
# CODEX-AUTH-001: the managed Codex 0.124 runtime exceeds Credential Manager's
# per-entry size limit for some ChatGPT sessions. Its dedicated profile is
# therefore protected with an exact Windows DACL and EFS before file-backed
# Codex auth is enabled (see src/ai/codex.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
