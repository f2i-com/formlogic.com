[package]
name = "formlogic-runtime"
version = "0.1.0"
edition = "2021"
description = "FormLogic's sandboxed evaluator for author-written expressions and onSubmit scripts"
publish = false

# Its own workspace, deliberately. Cargo unifies features within a workspace, and
# this binary must resolve zipp-vm with `safe-sandbox` and WITHOUT `jit` — sharing
# a feature-resolution domain with anything that wants the JIT would silently pull
# native code generation into the sandbox. zipp's own hardened runner is separated
# for exactly this reason.
[workspace]
resolver = "2"

[profile.dev]
overflow-checks = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# An integer wrap in VM bookkeeping should stop the process, never quietly become
# an index or limit bypass in the artifact that runs untrusted code.
overflow-checks = true
panic = "abort"
strip = true

[[bin]]
name = "formlogic-runtime"
path = "src/main.rs"

[dependencies]
# Pinned by revision: this is a security boundary and must not move under us on a
# rebuild. `safe-sandbox` is the interpreter-only profile — no JIT, unsafe code is
# a compile error in the VM and the regex engine, and there is no filesystem,
# process or network surface for a guest to reach.
zipp-vm = { git = "https://github.com/f2i-com/zipp.org", rev = "ddbf7cd9", default-features = false, features = ["safe-sandbox"] }
serde_json = "1"
