[package]
name = "native-runtime"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "native_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: canonical-JSON signature verification (#12) must keep manifest key order
# byte-for-byte with PHP SigningService::canonical (json_encode preserves array order).
serde_json = { version = "1", features = ["preserve_order"] }
# Signed client-manifest verification (#12): detached Ed25519 over canonical JSON + base64.
ed25519-dalek = { version = "2", features = ["signature"] }
base64 = "0.22"
# Blocking HTTP to fetch the app's signed manifest + the server's public key. native-tls uses
# Windows SChannel on the desktop target (no aws-lc-rs/nasm build step that rustls-tls needs).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }

