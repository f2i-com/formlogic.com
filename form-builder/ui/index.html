<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#6366f1" />
    <meta name="theme-color" content="#6366f1" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) resolves to real values on
         notched phones — the mobile nav/FAB safe-area padding relies on it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="FormLogic — The form platform for serious applications. Build forms with real backend logic, dedicated databases, and full data control." />
    <title>FormLogic — Form Builder</title>

    <!-- Open Graph / Twitter card so shared links render a branded preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FormLogic" />
    <meta property="og:title" content="FormLogic — The form platform for serious applications" />
    <meta property="og:description" content="Build forms with real backend logic, dedicated per-form databases, and full data control." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FormLogic — The form platform for serious applications" />
    <meta name="twitter:description" content="Build forms with real backend logic, dedicated per-form databases, and full data control." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: load non-render-blocking (preload as style, then promote to
         stylesheet) so the third-party round-trip doesn't delay first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
