name: Resolve the OAIY CLI release

# The same rule as resolve-softn-release.yml, for the other release this
# repository consumes: resolve the OAIY release ONCE, before any job installs
# the CLI, and hand every job the same frozen identity (tag, the commit the
# annotated tag points at, the asset, and the digest the release's own
# SHA256SUMS.txt publishes for it). An OAIY release published while this run
# is in flight cannot change what a later job runs: each consumer checks the
# bytes against the frozen digest, and refuses a tag that has moved or an
# asset that has been replaced since this step ran.
#
# The digest here is the release's, not this runner's: the step downloads
# SHA256SUMS.txt and nothing else, so what is frozen is what the publishing
# run recorded, not whatever a later download happened to return.
#
# Called by ci.yml as its `resolve-oaiy` job; the jobs that install the CLI
# pass needs.resolve-oaiy.outputs.frozen to scripts/fetch-oaiy-cli.mjs
# (--frozen <file>, or OAIY_CLI_FROZEN).
on:
  workflow_call:
    inputs:
      oaiy-cli-release:
        description: OAIY release tag to freeze (for example v0.0.5); empty resolves the latest release
        required: false
        default: ''
        type: string
    outputs:
      frozen:
        description: The frozen OAIY CLI release record (JSON) every job of the calling run installs
        value: ${{ jobs.resolve.outputs.frozen }}

jobs:
  resolve:
    name: Resolve and freeze
    runs-on: ubuntu-latest
    outputs:
      frozen: ${{ steps.resolve.outputs.frozen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Resolve and freeze
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OAIY_CLI_RELEASE: ${{ inputs.oaiy-cli-release }}
        run: |
          node scripts/fetch-oaiy-cli.mjs --resolve-only --frozen oaiy-cli-frozen.json
          { echo 'frozen<<FROZEN_RECORD'; cat oaiy-cli-frozen.json; echo 'FROZEN_RECORD'; } >> "$GITHUB_OUTPUT"
          node -e "const f=require('./oaiy-cli-frozen.json'); console.log('OAIY CLI release frozen for this run: '+f.tag+' @ '+f.tagCommit.slice(0,12)+' - '+f.assetName+' sha256 '+f.assetSha256)" >> "$GITHUB_STEP_SUMMARY"
