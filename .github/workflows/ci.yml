name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l) changed source
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Tests (unit + DB integration)
        run: composer test

      # Hard gate: any composer advisory fails CI. Accept an unavoidable one explicitly via
      # composer.json "config.audit.ignore" with a documented reason.
      - name: Security audit
        run: composer audit

  frontend:
    name: Frontend (Vite/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hard gate: the lint baseline is at zero, so any new ESLint problem fails CI. Genuinely
      # correct-but-flagged patterns are suppressed inline with justified eslint-disable comments.
      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      # Rough bundle budget: reports the initial (critical-path) JS payload and fails only on an
      # egregious regression. Heavy Monaco/QuickJS chunks are lazy and excluded.
      - name: Bundle budget (initial payload)
        run: node scripts/check-bundle-budget.mjs

      # Hard gate: every marketplace pack app ships a home dashboard and EVERY pack/sample form
      # ships a section screen (enabled + allowNewResponses + New-record affordance + design rules:
      # tokens only, no emoji, form-scoped SDK). A pack edit can't silently drop a screen.
      - name: Pack screen coverage
        run: node scripts/check-pack-screens.mjs

      # Hard gate: pins the custom-screen CSP as no-egress (data:/blob: only, connect-src 'none').
      # A careless widening to remote https: would reopen the record-exfil path — fail fast here.
      - name: Security invariants (custom-screen CSP)
        run: node scripts/check-security-invariants.mjs

      # The build's prebuild step syncs prelude.js into the backend; if that produced a diff,
      # the committed backend copy was stale (someone forgot `npm run sync:prelude`).
      - name: FormLogic prelude in sync (frontend ↔ backend)
        run: |
          git diff --exit-code ../backend/resources/formlogic-prelude.js \
            || (echo "::error::backend prelude is out of sync — run 'npm run sync:prelude' in form-builder/ui and commit the result" && exit 1)

      # Hard gate: high/critical advisories fail CI. Run `npm audit fix` to resolve, or pin/
      # override intentionally. (Dev-only tooling advisories: prefer `npm audit fix`; if truly
      # unavoidable, document in LAUNCH_CHECKLIST.md.)
      - name: Security audit (high/critical)
        run: npm audit --audit-level=high
