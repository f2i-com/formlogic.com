name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder/backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l) changed source
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Unit tests
        run: composer test

      - name: Security audit (advisory)
        run: composer audit
        continue-on-error: true

  frontend:
    name: Frontend (Vite/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: form-builder/ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Advisory for now: there's an accepted lint baseline (~49 problems) to drive to zero.
      # The typecheck+build step below is the hard gate.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck + build
        run: npm run build

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
