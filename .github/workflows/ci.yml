name: CI

# PAUSED 2026-07-12: automatic triggers (push/PR) disabled while the account is near
# its GitHub Actions usage limit. Run manually from the Actions tab. Restore the
# push/pull_request triggers below when usage resets.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formlogic/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l) changed source
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Tests (unit + DB integration)
        run: composer test

      # Static analysis gate (audit FL-CI-001): phpstan level 3 (clean
      # baseline; 4/5 are the documented burn-down).
      - name: Static analysis (phpstan)
        run: composer analyse

      # Hard gate: any composer advisory fails CI. Accept an unavoidable one explicitly via
      # composer.json "config.audit.ignore" with a documented reason.
      # Packagist's advisories API is flaky enough to time out (curl error 28), which
      # used to red-X the whole run on pure infrastructure weather — retry with backoff,
      # and if it STILL can't be reached, warn-and-skip. Real advisories still fail hard
      # (and the release gate in package.yml never skips).
      - name: Security audit
        run: |
          for attempt in 1 2 3; do
            if out=$(composer audit --no-interaction 2>&1); then
              echo "$out"
              exit 0
            else
              code=$?
              echo "$out"
              if ! echo "$out" | grep -qiE 'curl error|timed out|could not resolve host|network is unreachable'; then
                exit "$code"
              fi
              echo "composer audit attempt ${attempt}/3 hit a network error — retrying"
              sleep $((attempt * 15))
            fi
          done
          echo "::warning::composer audit skipped — packagist.org advisories API was unreachable after 3 attempts"

  frontend:
    name: Frontend (Vite/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formlogic/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Hard gate: the lint baseline is at zero, so any new ESLint problem fails CI. Genuinely
      # correct-but-flagged patterns are suppressed inline with justified eslint-disable comments.
      - name: Lint
        run: npm run lint

      # The full Vitest suite (client-runtime, flows, packs, connectors, aokie
      # screens) — audit REL-001/C-09: CI previously built without running it.
      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build

      # Rough bundle budget: reports the initial (critical-path) JS payload and fails only on an
      # egregious regression. Heavy Monaco/QuickJS chunks are lazy and excluded.
      - name: Bundle budget (initial payload)
        run: node scripts/check-bundle-budget.mjs

      # Hard gate: every marketplace pack app ships a home dashboard and EVERY pack/sample form
      # ships a section screen (enabled + allowNewResponses + New-record affordance + design rules:
      # tokens only, no emoji, form-scoped SDK). A pack edit can't silently drop a screen.
      - name: Pack screen coverage
        run: node scripts/check-pack-screens.mjs

      # Hard gate: pins the custom-screen CSP as no-egress (data:/blob: only, connect-src 'none').
      # A careless widening to remote https: would reopen the record-exfil path — fail fast here.
      - name: Security invariants (custom-screen CSP)
        run: node scripts/check-security-invariants.mjs

      # The build's prebuild step syncs prelude.js into the backend; if that produced a diff,
      # the committed backend copy was stale (someone forgot `npm run sync:prelude`).
      - name: FormLogic prelude in sync (frontend ↔ backend)
        run: |
          git diff --exit-code ../backend/resources/formlogic-prelude.js \
            || (echo "::error::backend prelude is out of sync — run 'npm run sync:prelude' in formlogic/ui and commit the result" && exit 1)

      # Hard gate: high/critical advisories fail CI. Run `npm audit fix` to resolve, or pin/
      # override intentionally. (Dev-only tooling advisories: prefer `npm audit fix`; if truly
      # unavoidable, document in LAUNCH_CHECKLIST.md.)
      - name: Security audit (high/critical)
        run: npm audit --audit-level=high

  desktop:
    # FormLogic Desktop's Rust runtime (flow dispatcher, plugin host, event
    # receipts, relay) + its web UI — audit REL-001/C-09 + CI-DESKTOP-001.
    # Previously CI ran only `cargo test --lib`, missing the integration tests
    # (tests/*.rs: plugin host, flow runtime, desktop-service nodes, aokie
    # contract) and the Desktop UI build. Runs on Windows because that is the
    # ONLY platform the desktop ships on.
    name: Desktop (Rust + UI, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: formlogic/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      - name: Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: formlogic/desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/desktop/package-lock.json

      # CI-DESKTOP-001: the FULL suite — lib AND integration tests (tests/*.rs).
      # The aokie contract tests self-skip when the aokie-plugin binary isn't
      # present (it lives in a separate repo), so this stays green here while
      # still exercising the plugin host, flow runtime and desktop-node paths so
      # a connector/plugin/flow/runtime regression blocks the PR.
      - name: Tests (lib + integration)
        run: cargo test

      # CI-DESKTOP-001: build the Desktop web UI (tsc typecheck + vite build) so
      # a UI regression blocks the PR, not just a Rust one. (The release job in
      # package.yml already does this via `tauri build`; this brings it forward
      # to every PR.)
      - name: Desktop UI build
        working-directory: formlogic/desktop
        run: |
          npm ci
          npm run build
