name: CI

# PAUSED 2026-09-12: automatic push/PR checks remain disabled while checks are
# performed manually. Run from the Actions tab when needed. Restore the
# push/pull_request triggers below when automatic CI is explicitly re-enabled.
on:
  workflow_dispatch:
    inputs:
      softn-release:
        description: Softn release tag to test against (for example v0.0.13); empty resolves the latest release once for both jobs
        required: false
        default: ''
        type: string
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  # Release-readiness FL-S01: resolve the Softn release ONCE, before any job
  # installs it; every job below installs that frozen record
  # (resolve-softn-release.yml says how).
  resolve:
    name: Resolve the Softn release for this run
    uses: ./.github/workflows/resolve-softn-release.yml
    with:
      softn-release: ${{ inputs.softn-release }}

  backend:
    name: Backend (PHP)
    # Pinned, like ZIPP's own release lanes: this job builds the server sandbox.
    runs-on: ubuntu-24.04
    needs: resolve
    defaults:
      run:
        working-directory: formlogic/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, sodium, mbstring, curl, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l) changed source
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Set up Node for native backend tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Prepare native app runtime
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          native-only: 'true'
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      # The server sandbox is not in git: compiled here, every run, from the
      # source of the ZIPP release the Softn release above names (dependency
      # cache only), smoke-tested, recorded in bin/runtime/SOURCE.json, and
      # proved runnable by PHP, so the sandbox suites below run rather than skip.
      - name: Build the server sandbox
        uses: ./.github/actions/prepare-sandbox-runtime
        with:
          mode: build
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Tests (unit + DB integration)
        run: composer test

      # Static analysis gate (audit FL-CI-001): phpstan level 3 (clean
      # baseline; 4/5 are the documented burn-down).
      - name: Static analysis (phpstan)
        run: composer analyse

      # Hard gate: any composer advisory fails CI. Accept an unavoidable one explicitly via
      # composer.json "config.audit.ignore" with a documented reason.
      # Packagist's advisories API is flaky enough to time out (curl error 28), which
      # used to red-X the whole run on pure infrastructure weather — retry with backoff,
      # and if it STILL can't be reached, warn-and-skip. Real advisories still fail hard
      # (and the release gate in package.yml never skips).
      - name: Security audit
        run: |
          for attempt in 1 2 3; do
            if out=$(composer audit --no-interaction 2>&1); then
              echo "$out"
              exit 0
            else
              code=$?
              echo "$out"
              if ! echo "$out" | grep -qiE 'curl error|timed out|could not resolve host|network is unreachable|could not be downloaded|HTTP/[0-9.]+ 5[0-9][0-9]'; then
                exit "$code"
              fi
              echo "composer audit attempt ${attempt}/3 hit a network error — retrying"
              sleep $((attempt * 15))
            fi
          done
          # ECO-01: an unreachable advisory service is recorded as UNKNOWN, never as
          # clean. The release gate (package.yml) stops on it; this fast lane records it
          # in the run summary so nobody reads a green check as an audited dependency set.
          echo "::warning::composer audit result UNKNOWN — packagist.org advisories API was unreachable after 3 attempts; the release gate must re-run it"
          {
            echo "## Dependency audit: UNKNOWN"
            echo "composer audit could not reach packagist.org after 3 attempts at $(date -u +%FT%TZ) for revision ${GITHUB_SHA}."
            echo "This revision has NOT been audited. package.yml refuses to release without a completed audit."
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (Vite/TS)
    runs-on: ubuntu-latest
    needs: resolve
    defaults:
      run:
        working-directory: formlogic/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      # The action installs the Softn release this run froze (no Softn
      # checkout or build) and ends by checking the committed compatibility
      # manifest against this tree and that release, so every job that
      # prepares the runtime (this one, the backend job, e2e and packaging)
      # fails on a stale manifest or an incompatible release before any test.
      - name: Prepare hosted app runtime
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Install dependencies
        run: npm ci

      # Hard gate: the lint baseline is at zero, so any new ESLint problem fails CI. Genuinely
      # correct-but-flagged patterns are suppressed inline with justified eslint-disable comments.
      - name: Lint
        run: npm run lint

      # The full Vitest suite (client-runtime, flows, packs, connectors, aokie
      # screens) — audit REL-001/C-09: CI previously built without running it.
      - name: Unit tests (Vitest)
        run: npm test

      - name: Typecheck + build
        run: npm run build

      - name: Shared ZIPP browser integration
        run: |
          npx playwright install --with-deps chromium
          npm run test:zipp-sharing

      # Rough bundle budget: reports the initial (critical-path) JS payload and fails only on an
      # egregious regression. Heavy Monaco/ZIPP engine chunks are lazy and excluded.
      - name: Bundle budget (initial payload)
        run: node scripts/check-bundle-budget.mjs

      # Hard gate: every marketplace pack app ships a home dashboard and EVERY pack/sample form
      # ships a section screen (enabled + allowNewResponses + New-record affordance + design rules:
      # tokens only, no emoji, form-scoped SDK). A pack edit can't silently drop a screen.
      - name: Pack screen coverage
        run: node scripts/check-pack-screens.mjs

      # Hard gate: pins the custom-screen CSP as no-egress (data:/blob: only, connect-src 'none').
      # A careless widening to remote https: would reopen the record-exfil path — fail fast here.
      - name: Security invariants (custom-screen CSP)
        run: node scripts/check-security-invariants.mjs

      # Hard gate: engines come from releases and CI builds, never git. Static (git
      # ls-files and the tracked bytes): no tracked wasm/ELF/PE binary (the sandbox's
      # included), nothing under ui/vendor, no zipp_wasm* file, no zipp.org pin in a
      # Cargo.toml, no ZIPP checkout outside the sandbox action.
      - name: Engine provenance guard
        working-directory: ${{ github.workspace }}
        run: node scripts/engine-provenance-guard.mjs

      # The contracts the guard and the fetch stand on, over fixtures (no network, no
      # installed tree): every refusal of a Softn archive, the one-generation install and
      # its rollback, the guard's rules, the manifest never re-pinning ZIPP, source-mode
      # sync, what package-dist holds a UI build to, the sandbox's ZIPP source and
      # generated lock, its provenance, and the parity legs tied to one ZIPP release.
      - name: Engine sourcing script tests
        working-directory: ${{ github.workspace }}
        run: node --test scripts/fetch-softn-release.test.mjs scripts/prepare-hosted-runtime.test.mjs scripts/engine-provenance-guard.test.mjs scripts/ecosystem-manifest.test.mjs scripts/sync-zipp-from-softn.test.mjs scripts/release-runtime.test.mjs scripts/zipp-source.test.mjs scripts/runtime-provenance.test.mjs scripts/check-expression-parity.test.mjs scripts/prepare-sandbox-runtime.test.mjs

      # The build's prebuild step syncs prelude.js into the backend; if that produced a diff,
      # the committed backend copy was stale (someone forgot `npm run sync:prelude`).
      - name: FormLogic prelude in sync (frontend ↔ backend)
        run: |
          git diff --exit-code ../backend/resources/formlogic-prelude.js \
            || (echo "::error::backend prelude is out of sync — run 'npm run sync:prelude' in formlogic/ui and commit the result" && exit 1)

      # Hard gate: high/critical advisories fail CI. Run `npm audit fix` to resolve, or pin/
      # override intentionally. (Dev-only tooling advisories: prefer `npm audit fix`; if truly
      # unavoidable, document in LAUNCH_CHECKLIST.md.)
      - name: Security audit (high/critical)
        run: npm audit --audit-level=high
