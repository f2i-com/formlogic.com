name: E2E (Playwright) — release gate

# Full-stack launch golden paths. Runs the real PHP + MySQL + built SPA on ONE origin (so cookies are
# same-origin over HTTP) and drives it with Playwright/Chrome. Not on every PR — it's the slow, full-stack
# gate. THIS WORKFLOW MUST BE GREEN BEFORE LAUNCH (see docs/RELEASE_RUNBOOK.md). Runs nightly, on any
# `v*` release tag, and on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC

jobs:
  e2e:
    name: E2E golden paths
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: formlogic
      DB_USERNAME: root
      DB_PASSWORD: root
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_API_URL: http://127.0.0.1:8080/api
      E2E_EMAIL: test@example.com
      E2E_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, curl, gd, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/ui/package-lock.json

      - name: Install backend dependencies
        working-directory: form-builder/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Backend config (.env) + storage dirs
        working-directory: form-builder/backend
        run: |
          mkdir -p storage/forms storage/packs storage/uploads logs
          cat > .env <<EOF
          APP_ENV=development
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=formlogic
          DB_USERNAME=root
          DB_PASSWORD=root
          JWT_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')
          AUDIT_HMAC_KEY=$(php -r 'echo bin2hex(random_bytes(32));')
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080
          EOF

      - name: Import database schema
        working-directory: form-builder/backend
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot formlogic < database/schema.sql

      - name: Build the SPA (same-origin API)
        working-directory: form-builder/ui
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      - name: Start the app (SPA + API on one origin)
        run: |
          php -S 127.0.0.1:8080 -t form-builder/ui/dist form-builder/ci/router.php > php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "server up"; break
            fi
            sleep 1
          done

      - name: Seed the E2E test account
        run: |
          curl -fsS -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@example.com","password":"password123","name":"E2E Test"}' \
            || echo "register returned non-2xx (user may already exist) — continuing"

      - name: Install Playwright Chrome
        working-directory: form-builder/ui
        run: npx playwright install --with-deps chrome

      - name: Run E2E
        working-directory: form-builder/ui
        run: npm run test:e2e

      - name: Server log (on failure)
        if: failure()
        run: cat php-server.log || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            form-builder/ui/test-results/
            form-builder/ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
