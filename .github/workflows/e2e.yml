name: E2E (Playwright) — release gate

# Full-stack launch golden paths. Runs the real PHP + MySQL + built SPA on ONE origin (so cookies are
# same-origin over HTTP) and drives it with Playwright/Chrome.
#
# Audit REL-001/C-09: this is the RELEASE GATE the launch checklist documents — it runs
# nightly, on every v* release tag, and on demand. (It was temporarily manual-only while
# resource-heavy; the checklist and reality must match, and tag pushes are rare enough
# that the cost is fine.)
# PAUSED 2026-07-12: the nightly schedule is disabled while the account is near its
# GitHub Actions usage limit. Run manually from the Actions tab. Restore the
# schedule block below when usage resets.
on:
  workflow_dispatch:
  # Callable as a reusable workflow (audit FL-E2E-001/FL-REL-001): package.yml
  # invokes it on v* tags and HARD-DEPENDS on it — the standalone tag trigger
  # is gone so a tag runs the suite exactly once, as a release requirement.
  workflow_call:
  # schedule:
  #   # Nightly at 15:20 UTC (~01:20 AEST) — off the top-of-hour rush.
  #   - cron: '20 15 * * *'

jobs:
  e2e:
    name: E2E golden paths
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      # NOTE: deliberately NO job-level DB_* here. The backend reads them from the .env file written
      # below; job-level DB_* would sit in the process environment where IMMUTABLE Dotenv sees them
      # as "already set" and skips copying them into $_ENV — with a variables_order that omits E,
      # $_ENV then stays empty and PHP silently falls back to localhost/defaults (this exact
      # interaction broke the provision step). The mysql-client schema import hardcodes its creds.
      E2E_BASE_URL: http://127.0.0.1:8080
      # Host only — the specs append "/api/..." themselves (matches the api.formlogic.local default).
      E2E_API_URL: http://127.0.0.1:8080
      E2E_EMAIL: test@example.com
      E2E_PASSWORD: password123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, curl, gd, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      - name: Install backend dependencies
        working-directory: formlogic/backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Backend config (.env) + storage dirs
        working-directory: formlogic/backend
        run: |
          mkdir -p storage/forms storage/packs storage/uploads storage/pack-screenshots logs
          cat > .env <<EOF
          APP_ENV=development
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=formlogic
          DB_USERNAME=root
          DB_PASSWORD=root
          JWT_SECRET=$(php -r 'echo bin2hex(random_bytes(32));')
          AUDIT_HMAC_KEY=$(php -r 'echo bin2hex(random_bytes(32));')
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:8080
          EOF

      - name: Import database schema
        working-directory: formlogic/backend
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot formlogic < database/schema.sql

      - name: Build the SPA (same-origin API)
        working-directory: formlogic/ui
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build

      # Audit FL-32: readiness FAILS the job when the server never comes up —
      # the old loop fell through after 30 tries and let Playwright produce 60
      # confusing connection-refused failures instead of one clear one.
      - name: Start the app (SPA + API on one origin)
        run: |
          php -S 127.0.0.1:8080 -t formlogic/ui/dist formlogic/ci/router.php > php-server.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "server up"; ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::server did not become ready within 30s"
            cat php-server.log || true
            exit 1
          fi

      # Audit FL-32: registration succeeds, or is the one explicit
      # "already exists" answer — every OTHER failure (500, validation)
      # stops the job immediately instead of limping into Playwright.
      # The response body is logged (it carries no secrets: a typed error
      # or the user object of the throwaway CI account).
      - name: Seed the E2E test account
        run: |
          status=$(curl -sS -o register-response.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"test@example.com","password":"password123","name":"E2E Test"}')
          echo "register HTTP ${status}"
          cat register-response.json || true
          case "$status" in
            2??) echo "registered" ;;
            *)
              if grep -qi 'already' register-response.json; then
                echo "user already exists — continuing"
              else
                echo "::error::registration failed with HTTP ${status}"
                exit 1
              fi
              ;;
          esac

      # Seed the marketplace catalog + the shared Demo account's apps (idempotent). The pack sources
      # are the committed resources/marketplace-packs/*.json, so no emit-marketplace step is needed.
      # Required by app-dashboard.spec.ts (which drives the Live Demo).
      - name: Provision marketplace + demo data
        working-directory: formlogic/backend
        run: php scripts/provision-demo.php

      - name: Install Playwright Chrome
        working-directory: formlogic/ui
        run: npx playwright install --with-deps chrome

      - name: Run E2E
        working-directory: formlogic/ui
        run: npm run test:e2e

      - name: Server log (on failure)
        if: failure()
        run: cat php-server.log || true

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            formlogic/ui/test-results/
            formlogic/ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
