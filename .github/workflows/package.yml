name: Package (distributable zip)

# Builds the single-domain release zip (built UI at the zip root, production-filtered backend
# under api/, INSTALL.txt/UPGRADE.txt/VERSION) via scripts/package-dist.mjs — the SAME script
# devs run locally. Runs on every v* tag (and attaches the zip to the GitHub release) and on
# demand from the Actions tab (artifact only).
# PAUSED 2026-07-12: the automatic v* tag trigger is disabled while the account is
# near its GitHub Actions usage limit. Run manually from the Actions tab (pick the
# tag as the ref to build a release). Restore the push:tags block when usage resets.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - 'v*'

# TRUST-001: least privilege — read-only token by default; ONLY the two jobs
# that upload release assets (desktop installer + distributable zip) ask for
# contents:write themselves.
permissions:
  contents: read

jobs:
  # Audit REL-001/C-09: packaging must depend on the exact SHA passing the
  # required checks — a tagged release could previously publish with failing
  # (or never-run) tests. This runs the same backend + frontend gates ci.yml
  # runs, IN this workflow, so `package` can hard-require them via `needs`.
  verify:
    name: Verify (tests must pass before packaging)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      # Audit FL-REL-001: the release gate must be IDENTICAL-or-stricter than
      # main CI — a tag could previously package from a commit that never ran
      # lint, audits, the bundle budget or the prelude-sync check.
      - name: Backend gates (validate, lint, tests, audit)
        working-directory: formlogic/backend
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          composer test
          composer analyse
          # Release gate stays STRICTER than main CI: retry packagist timeouts
          # (curl error 28), but never skip the audit for a release.
          for attempt in 1 2 3; do
            if out=$(composer audit --no-interaction 2>&1); then
              echo "$out"
              break
            else
              code=$?
              echo "$out"
              if ! echo "$out" | grep -qiE 'curl error|timed out|could not resolve host|network is unreachable'; then
                exit "$code"
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::composer audit unreachable after 3 attempts — a release requires a completed audit"
                exit "$code"
              fi
              echo "composer audit attempt ${attempt}/3 hit a network error — retrying"
              sleep $((attempt * 15))
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      - name: Frontend gates (lint, tests, build, budget, invariants, audit)
        working-directory: formlogic/ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          node scripts/check-bundle-budget.mjs
          node scripts/check-pack-screens.mjs
          node scripts/check-security-invariants.mjs
          git diff --exit-code ../backend/resources/formlogic-prelude.js \
            || (echo "::error::backend prelude is out of sync — run 'npm run sync:prelude' in formlogic/ui and commit the result" && exit 1)
          npm audit --audit-level=high

  # Audit FL-E2E-001: the launch golden paths are a RELEASE REQUIREMENT — the
  # zip and the desktop installers cannot publish from a SHA whose end-to-end
  # suite hasn't passed. Reuses the exact e2e workflow the nightly runs.
  e2e:
    name: E2E golden paths (release gate)
    uses: ./.github/workflows/e2e.yml

  # Audit PKG-001 (best-effort until signing infrastructure exists): build the
  # Windows desktop installers (NSIS + MSI via `tauri build`), run the desktop
  # test suite on the exact release SHA first, hash everything, sign when a
  # certificate is configured, and publish. UNSIGNED artifacts are loudly
  # flagged — SmartScreen will warn users — and the gap closes the day the
  # WINDOWS_CERT_PFX_B64 / WINDOWS_CERT_PASSWORD secrets are added.
  desktop:
    name: Build Windows desktop installer
    permissions:
      contents: write # gh release upload (tag builds)
    runs-on: windows-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: formlogic/desktop/src-tauri

      - name: Desktop tests (release gate on the exact SHA)
        working-directory: formlogic/desktop/src-tauri
        # CI-DESKTOP-001: lib AND integration tests on the release SHA (the
        # aokie contract tests self-skip without the plugin binary).
        run: cargo test

      - name: Build installers (NSIS + MSI)
        working-directory: formlogic/desktop
        run: |
          npm ci
          npm run tauri build -- --features gui

      - name: Sign installers (when a certificate is configured)
        shell: pwsh
        working-directory: formlogic/desktop/src-tauri/target/release/bundle
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) {
            # TRUST-001: a public TAG release must never ship unsigned; manual
            # dispatch smoke builds may proceed with a loud warning.
            if ('${{ github.ref_type }}' -eq 'tag') {
              throw "TRUST-001: tag releases require WINDOWS_CERT_PFX_B64/WINDOWS_CERT_PASSWORD — refusing to publish unsigned installers"
            }
            Write-Warning "PKG-001: no signing certificate configured — UNSIGNED smoke build (SmartScreen will warn). Add the WINDOWS_CERT_PFX_B64 + WINDOWS_CERT_PASSWORD secrets to close the gap."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem -Recurse -Include *.exe,*.msi | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($_.Name)" }
          }
          Remove-Item $pfx

      # Integrity even without a signature: a published SHA256SUMS lets anyone
      # verify a downloaded installer wasn't tampered with in transit.
      - name: Checksums
        shell: pwsh
        working-directory: formlogic/desktop/src-tauri/target/release/bundle
        run: |
          $files = Get-ChildItem -Recurse -Include *.exe,*.msi
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formlogic-desktop-windows
          path: |
            formlogic/desktop/src-tauri/target/release/bundle/**/*.exe
            formlogic/desktop/src-tauri/target/release/bundle/**/*.msi
            formlogic/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Recurse formlogic/desktop/src-tauri/target/release/bundle -Include *.exe,*.msi,SHA256SUMS.txt | ForEach-Object FullName
          gh release upload "$env:GITHUB_REF_NAME" @files --repo "$env:GITHUB_REPOSITORY" --clobber

  package:
    name: Build distributable zip
    permissions:
      contents: write # gh release create/upload/edit (tag builds)
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Mirrors ci.yml: PHP 8.3 for the staged `composer install --no-dev`.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      # Mirrors ci.yml: Node 20 for the UI build.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      # npm ci + npm run build + backend staging + composer --no-dev + zip, all in one script.
      # Version comes from the tag (vX.Y.Z -> X.Y.Z) or falls back to <short-sha>-<date>.
      - name: Build the distributable zip
        run: node scripts/package-dist.mjs

      # Always keep the zip as a workflow artifact (this is the only output for
      # workflow_dispatch runs on untagged commits).
      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formlogic-dist
          path: dist-package/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tag builds additionally attach the zip to the GitHub release for that tag,
      # creating the release if it doesn't exist yet (gh is preinstalled on the runner).
      # The final `release edit --draft=false` matters: deleting/re-pushing a tag orphans its
      # release into a DRAFT (invisible to the public), and `gh release view` still finds that
      # draft — without the edit, the zip uploads into a release nobody can see.
      - name: Attach zip to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "FormLogic $GITHUB_REF_NAME" --generate-notes
          fi
          # Ensure the release is PUBLISHED (no-op when it already is).
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
