name: Package (distributable zip)

# Builds the single-domain release zip (built UI at the zip root, production-filtered backend
# under api/, INSTALL.txt/UPGRADE.txt/VERSION) via scripts/package-dist.mjs — the SAME script
# devs run locally. Runs on every v* tag (and attaches the zip to the GitHub release) and on
# demand from the Actions tab (artifact only).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # Needed to create/upload assets on the GitHub release for tag builds.
  contents: write

jobs:
  # Audit REL-001/C-09: packaging must depend on the exact SHA passing the
  # required checks — a tagged release could previously publish with failing
  # (or never-run) tests. This runs the same backend + frontend gates ci.yml
  # runs, IN this workflow, so `package` can hard-require them via `needs`.
  verify:
    name: Verify (tests must pass before packaging)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      - name: Backend tests
        working-directory: form-builder/backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          composer test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/ui/package-lock.json

      - name: Frontend tests + invariants
        working-directory: form-builder/ui
        run: |
          npm ci
          npm test
          node scripts/check-pack-screens.mjs
          node scripts/check-security-invariants.mjs

  # Audit PKG-001 (best-effort until signing infrastructure exists): build the
  # Windows desktop installers (NSIS + MSI via `tauri build`), run the desktop
  # test suite on the exact release SHA first, hash everything, sign when a
  # certificate is configured, and publish. UNSIGNED artifacts are loudly
  # flagged — SmartScreen will warn users — and the gap closes the day the
  # WINDOWS_CERT_PFX_B64 / WINDOWS_CERT_PASSWORD secrets are added.
  desktop:
    name: Build Windows desktop installer
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: form-builder/desktop/src-tauri

      - name: Desktop tests (release gate on the exact SHA)
        working-directory: form-builder/desktop/src-tauri
        run: cargo test --lib

      - name: Build installers (NSIS + MSI)
        working-directory: form-builder/desktop
        run: |
          npm ci
          npm run tauri build -- --features gui

      - name: Sign installers (when a certificate is configured)
        shell: pwsh
        working-directory: form-builder/desktop/src-tauri/target/release/bundle
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_B64) {
            Write-Warning "PKG-001: no signing certificate configured — shipping UNSIGNED installers (SmartScreen will warn). Add the WINDOWS_CERT_PFX_B64 + WINDOWS_CERT_PASSWORD secrets to close the gap."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          Get-ChildItem -Recurse -Include *.exe,*.msi | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($_.Name)" }
          }
          Remove-Item $pfx

      # Integrity even without a signature: a published SHA256SUMS lets anyone
      # verify a downloaded installer wasn't tampered with in transit.
      - name: Checksums
        shell: pwsh
        working-directory: form-builder/desktop/src-tauri/target/release/bundle
        run: |
          $files = Get-ChildItem -Recurse -Include *.exe,*.msi
          $files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: formlogic-desktop-windows
          path: |
            form-builder/desktop/src-tauri/target/release/bundle/**/*.exe
            form-builder/desktop/src-tauri/target/release/bundle/**/*.msi
            form-builder/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Attach installers to the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem -Recurse form-builder/desktop/src-tauri/target/release/bundle -Include *.exe,*.msi,SHA256SUMS.txt | ForEach-Object FullName
          gh release upload "$env:GITHUB_REF_NAME" @files --repo "$env:GITHUB_REPOSITORY" --clobber

  package:
    name: Build distributable zip
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      # Mirrors ci.yml: PHP 8.3 for the staged `composer install --no-dev`.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, curl, gd, zip
          coverage: none

      # Mirrors ci.yml: Node 20 for the UI build.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: form-builder/ui/package-lock.json

      # npm ci + npm run build + backend staging + composer --no-dev + zip, all in one script.
      # Version comes from the tag (vX.Y.Z -> X.Y.Z) or falls back to <short-sha>-<date>.
      - name: Build the distributable zip
        run: node scripts/package-dist.mjs

      # Always keep the zip as a workflow artifact (this is the only output for
      # workflow_dispatch runs on untagged commits).
      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: formlogic-dist
          path: dist-package/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tag builds additionally attach the zip to the GitHub release for that tag,
      # creating the release if it doesn't exist yet (gh is preinstalled on the runner).
      # The final `release edit --draft=false` matters: deleting/re-pushing a tag orphans its
      # release into a DRAFT (invisible to the public), and `gh release view` still finds that
      # draft — without the edit, the zip uploads into a release nobody can see.
      - name: Attach zip to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "FormLogic $GITHUB_REF_NAME" --generate-notes
          fi
          # Ensure the release is PUBLISHED (no-op when it already is).
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
