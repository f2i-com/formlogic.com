name: Package (distributable zip)

# Builds the single-domain release zip — the built web app at the zip root, the
# production-filtered PHP backend under api/ (composer --no-dev, the sandbox
# launchers this run builds, the prelude), install.php + INSTALL.txt/UPGRADE.txt/VERSION — via
# scripts/package-dist.mjs, the SAME script developers run locally. The result is
# what a host drops onto a web root and installs through install.php.
#
# The server sandbox is built here, every run, from the source of the ZIPP release
# the frozen Softn release names: sandbox-linux builds the guest and the Linux
# launcher, sandbox-windows the Windows launcher embedding that same guest. Every
# gate below tests the Linux launcher this run built, and the zip ships both.
#
# TRIGGER: manual, by design. Pushing a tag does NOT start a build (the account
# sits near its Actions allowance, and a release is a decision, not a side
# effect of `git push --tags`). To cut a release:
#
#   1. tag the commit:        git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#   2. Actions → "Package (distributable zip)" → Run workflow
#      → "Use workflow from": pick the TAG (Tags tab), not a branch → Run
#
# Run from a tag, the zip is attached to the GitHub release for that tag (created
# if missing, published if it was a draft). Run from a branch, the zip is kept as a
# workflow artifact only and no release is touched. Either way the same gates
# (backend, frontend, e2e) must pass on that exact commit first.
on:
  workflow_dispatch:
    inputs:
      softn-release:
        description: Softn release tag to build against (for example v0.0.13); empty resolves the latest release once for the whole run
        required: false
        default: ''
        type: string

# TRUST-001: least privilege — read-only token by default; ONLY the job that
# uploads the release asset (the distributable zip) asks for contents:write
# itself.
permissions:
  contents: read

jobs:
  # Release-readiness FL-S01: resolve the Softn release ONCE, before any job
  # installs it; every job below installs that frozen record
  # (resolve-softn-release.yml says how).
  resolve:
    name: Resolve the Softn release for this run
    uses: ./.github/workflows/resolve-softn-release.yml
    with:
      softn-release: ${{ inputs.softn-release }}

  # The server sandbox, compiled in this run from the source of the ZIPP release
  # the frozen Softn release names (the Softn archive is installed only to read
  # that record). Its artifacts carry repository-relative paths, including their
  # build records under .runtime-source/sandbox/, so consumers extract them at
  # the workspace root.
  sandbox-linux:
    name: Server sandbox (guest and Linux launcher)
    runs-on: ubuntu-24.04
    needs: resolve
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Install the frozen Softn release (it names the ZIPP release)
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          native-only: 'true'
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Build the server sandbox
        uses: ./.github/actions/prepare-sandbox-runtime
        with:
          mode: build
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}
          php-preflight: 'false'

      - name: Upload the guest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-guest
          path: |
            formlogic/runtime/host/formlogic-runtime-guest.wasm
            formlogic/runtime/guest/Cargo.lock
            .runtime-source/sandbox/guest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Linux launcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-linux
          path: |
            formlogic/backend/bin/runtime/formlogic-runtime-linux-x86_64
            .runtime-source/sandbox/linux.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # The Windows launcher is built on Windows (wasmtime's C helpers want cl.exe;
  # cross-compiling msvc from Linux would be a different compiler than it ships
  # with), and embeds the guest the Linux job built, so both launchers run one guest.
  sandbox-windows:
    name: Server sandbox (Windows launcher)
    runs-on: windows-2022
    needs: sandbox-linux
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Install the guest the Linux job built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sandbox-guest
          path: ${{ github.workspace }}

      # The toolchain the guest was built with: ZIPP's release toolchain.
      - name: Rust toolchain
        id: rust
        run: |
          toolchain="$(node scripts/runtime-provenance.mjs toolchain)"
          rustup toolchain install "$toolchain" --profile minimal --no-self-update
          lock="$(sha256sum formlogic/runtime/host/Cargo.lock | cut -c1-16)"
          echo "cache-key=sandbox-deps-${ImageOS:-unknown}-${ImageVersion:-unknown}-rust${toolchain}-host${lock}" >> "$GITHUB_OUTPUT"

      - name: Cargo dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            formlogic/runtime/host/target
          key: ${{ steps.rust.outputs.cache-key }}

      - name: Build the Windows launcher and smoke-test it
        run: bash scripts/build-runtime.sh windows smoke

      - name: Upload the Windows launcher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-windows
          path: |
            formlogic/backend/bin/runtime/formlogic-runtime-windows-x86_64.exe
            .runtime-source/sandbox/windows.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Audit REL-001/C-09: packaging must depend on the exact SHA passing the
  # required checks — a tagged release could previously publish with failing
  # (or never-run) tests. This runs the same backend + frontend gates ci.yml
  # runs, IN this workflow, so `package` can hard-require them via `needs`.
  verify:
    name: Verify (tests must pass before packaging)
    runs-on: ubuntu-latest
    needs: [resolve, sandbox-linux]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, sodium, mbstring, curl, gd, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      # One Softn release per run (FL-S01): this job installs the record the
      # resolve job froze, exactly what every other job of this run installs.
      - name: Prepare hosted app runtime
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Backend dependencies
        working-directory: formlogic/backend
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress

      # The Linux launcher sandbox-linux built in this run (after composer
      # install: the action ends by asking PHP whether it can run it).
      - name: Install this run's server sandbox
        uses: ./.github/actions/prepare-sandbox-runtime
        with:
          mode: install
          artifacts: sandbox-linux
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      # Audit FL-REL-001: the release gate must be IDENTICAL-or-stricter than
      # main CI — a tag could previously package from a commit that never ran
      # lint, audits, the bundle budget or the prelude-sync check.
      - name: Backend gates (lint, tests, audit)
        working-directory: formlogic/backend
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          composer test
          composer analyse
          # Release gate stays STRICTER than main CI: retry Packagist outages (curl
          # timeouts AND 5xx from the advisories endpoint — a 502 once cost a release
          # run), but never skip the audit for a release.
          for attempt in 1 2 3 4 5; do
            if out=$(composer audit --no-interaction 2>&1); then
              echo "$out"
              break
            else
              code=$?
              echo "$out"
              if ! echo "$out" | grep -qiE 'curl error|timed out|could not resolve host|network is unreachable|could not be downloaded|HTTP/[0-9.]+ 5[0-9][0-9]'; then
                exit "$code"
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::composer audit unreachable after 5 attempts — a release requires a completed audit"
                exit "$code"
              fi
              echo "composer audit attempt ${attempt}/5 hit a network error (Packagist 5xx or curl) — retrying"
              sleep $((attempt * 15))
            fi
          done

      - name: Test fresh and repeated marketplace setup
        run: php scripts/test-installer-marketplace.php

      - name: Test release contracts and PHP signature interoperability
        run: node --test scripts/release-signing.test.mjs scripts/installer-browser.test.mjs

      # A release carries no committed engine: static, over git ls-files.
      - name: Engine provenance guard
        run: node scripts/engine-provenance-guard.mjs

      # What the guard and the fetch stand on, over fixtures (no network, no installed
      # tree): the Softn archive's refusals and one-generation install, the guard's rules,
      # the manifest never re-pinning ZIPP, source-mode sync, package-dist's engine checks,
      # the sandbox's ZIPP source, generated lock and provenance, and the parity comparator.
      - name: Engine sourcing script tests
        run: node --test scripts/fetch-softn-release.test.mjs scripts/prepare-hosted-runtime.test.mjs scripts/engine-provenance-guard.test.mjs scripts/ecosystem-manifest.test.mjs scripts/sync-zipp-from-softn.test.mjs scripts/release-runtime.test.mjs scripts/zipp-source.test.mjs scripts/runtime-provenance.test.mjs scripts/check-expression-parity.test.mjs scripts/prepare-sandbox-runtime.test.mjs

      - name: Frontend gates (lint, tests, build, budget, invariants, audit)
        working-directory: formlogic/ui
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:zipp-sharing
          node scripts/check-bundle-budget.mjs
          node scripts/check-pack-screens.mjs
          node scripts/check-security-invariants.mjs
          git diff --exit-code ../backend/resources/formlogic-prelude.js \
            || (echo "::error::backend prelude is out of sync — run 'npm run sync:prelude' in formlogic/ui and commit the result" && exit 1)
          npm audit --audit-level=high

      # Both parity legs ran above (composer test wrote test-results/parity/backend.json
      # through this run's launcher, npm test wrote browser.json through the installed
      # engine): the engine-defined cases are compared only here, and both legs must name
      # the ZIPP release the frozen Softn release names.
      - name: Expression parity across the two engines
        run: node scripts/check-expression-parity.mjs

  # Audit FL-E2E-001: the launch golden paths are a RELEASE REQUIREMENT — the
  # zip cannot publish from a SHA whose end-to-end suite hasn't passed. Reuses the exact e2e workflow the nightly runs.
  e2e:
    name: E2E golden paths (release gate)
    needs: [resolve, sandbox-linux]
    uses: ./.github/workflows/e2e.yml
    with:
      frozen-release: ${{ needs.resolve.outputs.frozen }}
      sandbox-artifact: sandbox-linux

  php-floor:
    name: PHP 8.2 compatibility
    runs-on: ubuntu-latest
    needs: [resolve, sandbox-linux]
    defaults:
      run:
        working-directory: formlogic/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formlogic_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_TEST_DATABASE: formlogic_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, sodium, mbstring, curl, gd, zip
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint (php -l) changed source
        run: |
          find src public config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Set up Node for native backend tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Prepare native app runtime
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          native-only: 'true'
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Install this run's server sandbox
        uses: ./.github/actions/prepare-sandbox-runtime
        with:
          mode: install
          artifacts: sandbox-linux
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      - name: Tests (unit + DB integration)
        run: composer test


  package:
    name: Build distributable zip
    permissions:
      contents: write # gh release create/upload/edit (tag builds)
    runs-on: ubuntu-latest
    needs: [resolve, verify, e2e, php-floor, sandbox-linux, sandbox-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors ci.yml: PHP 8.3 for the staged `composer install --no-dev`.
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, sodium, mbstring, curl, gd, zip
          coverage: none

      # Mirrors ci.yml: the repository's pinned Node LTS for the UI build.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: formlogic/ui/package-lock.json

      # npm ci + npm run build + backend staging + composer --no-dev + zip, all in one script.
      # Version comes from the tag (vX.Y.Z -> X.Y.Z) or falls back to <short-sha>-<date>.
      - name: Say what this run will do
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Tag build: ${GITHUB_REF_NAME} — the zip will be attached to the GitHub release for this tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Branch build (${GITHUB_REF_NAME}): artifact only — no release is created. Re-run choosing a TAG to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The packaged runtime is the frozen one every gate above tested; the
      # action's manifest check runs in --exact mode with the same record.
      - name: Prepare hosted app runtime
        uses: ./.github/actions/prepare-hosted-runtime
        with:
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}

      # Both launchers this run built (one guest, the frozen release's ZIPP),
      # merged into the bin/runtime/SOURCE.json the zip ships beside them.
      - name: Install this run's server sandbox, both launchers
        uses: ./.github/actions/prepare-sandbox-runtime
        with:
          mode: install
          artifacts: sandbox-linux sandbox-windows
          frozen-release-json: ${{ needs.resolve.outputs.frozen }}
          php-preflight: 'false'

      # --release: the zip ships only a sandbox one CI run built.
      - name: Build the distributable zip
        env:
          FORMLOGIC_RELEASE_SIGNING_KEY_PEM: ${{ secrets.FORMLOGIC_RELEASE_SIGNING_KEY }}
          FORMLOGIC_RELEASE_PUBLIC_KEY: ${{ vars.FORMLOGIC_RELEASE_PUBLIC_KEY }}
        run: node scripts/package-dist.mjs --release

      # Always keep the zip as a workflow artifact (this is the only output for
      # workflow_dispatch runs on untagged commits).
      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formlogic-dist
          path: dist-package/*.zip
          if-no-files-found: error
          retention-days: 30

      # Tag builds additionally attach the zip to the GitHub release for that tag,
      # creating the release if it doesn't exist yet (gh is preinstalled on the runner).
      # The final `release edit --draft=false` matters: deleting/re-pushing a tag orphans its
      # release into a DRAFT (invisible to the public), and `gh release view` still finds that
      # draft — without the edit, the zip uploads into a release nobody can see.
      - name: Attach zip to the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-package/*.zip --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "FormLogic $GITHUB_REF_NAME" --generate-notes --draft
          fi
          node scripts/check-published-release.mjs
          # Ensure the release is PUBLISHED (no-op when it already is).
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
