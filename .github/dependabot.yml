# Scheduled dependency PRs; validation runs manually while automatic CI is paused.
# Related tools are grouped so major upgrades can satisfy their peer requirements together.
# These groups apply to version updates; security alerts remain enabled separately.
version: 2
updates:
  # Frontend (React/Vite/TS) — formlogic/ui
  - package-ecosystem: npm
    directory: /formlogic/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Order matters: these coupled packages join their first matching group.
      frontend-build:
        patterns: [vite, "@vitejs/plugin-react", vite-plugin-pwa]
      frontend-lint:
        patterns:
          - eslint
          - "@eslint/js"
          - typescript-eslint
          - "@typescript-eslint/*"
          - eslint-plugin-react-hooks
          - eslint-plugin-react-refresh
          - globals
      # Other development dependencies: routine updates can share one review.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime deps: group non-major so a routine bump is one reviewable PR; majors stay separate.
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Backend (PHP/Slim) — formlogic/backend
  - package-ecosystem: composer
    directory: /formlogic/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3


  # Native runtime (Tauri desktop/Android surface) — audit FL-33.
  - package-ecosystem: npm
    directory: /formlogic/native-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /formlogic/native-runtime/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native-crypto:
        patterns: [ed25519-dalek, chacha20poly1305, getrandom, sha2]
      native-cargo-minor-patch:
        update-types: [minor, patch]
