# Scheduled dependency PRs to keep launch maintenance boring. CI already runs `composer audit` and
# `npm audit --audit-level=high`; this opens the actual update PRs. Security updates are not batched
# (Dependabot always raises those immediately, ungrouped).
version: 2
updates:
  # Frontend (React/Vite/TS) — formlogic/ui
  - package-ecosystem: npm
    directory: /formlogic/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Dev tooling (linters, types, build) churns often and is low-risk — one PR.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      # Runtime deps: group non-major so a routine bump is one reviewable PR; majors stay separate.
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Backend (PHP/Slim) — formlogic/backend
  - package-ecosystem: composer
    directory: /formlogic/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # Desktop (Tauri shell) — audit FL-33: both native lockfiles were previously
  # uncovered by any update automation. Monthly + grouped keeps PR volume low.
  - package-ecosystem: npm
    directory: /formlogic/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      desktop-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /formlogic/desktop/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      desktop-cargo-minor-patch:
        update-types: [minor, patch]

  # Native runtime (Tauri desktop/Android surface) — audit FL-33.
  - package-ecosystem: npm
    directory: /formlogic/native-runtime
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /formlogic/native-runtime/src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      native-cargo-minor-patch:
        update-types: [minor, patch]
