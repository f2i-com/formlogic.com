name: Install the Softn runtime from its release
description: Fetch, verify and install the latest Softn release's FormLogic runtime archive (hosted runtime, embedded editors, native backend runtime)
inputs:
  native-only:
    description: Kept for callers that only need the native backend runtime; the release archive is small, so everything is installed either way
    default: 'false'
  softn-release:
    description: A Softn release tag to install instead of the latest (for example v0.0.13); empty means the latest release
    default: ''
  frozen-release:
    description: >-
      Path (in the workspace) of the frozen release record a run resolved once with
      `node scripts/fetch-softn-release.mjs --resolve-only --frozen <file>`. When set, this
      job installs exactly that release (tag, tag commit, asset, archive digest; any drift
      fails) and the manifest check runs in --exact mode. Empty means the latest release,
      for development use only: a multi-job run must pass the same record to every job.
    default: ''
runs:
  using: composite
  steps:
    # FormLogic embeds three things Softn builds — the hosted app runtime,
    # the two embedded editors and the native backend runtime — plus the
    # source of the vendored FormLogic adapter. Every Softn release publishes
    # them as softn-formlogic-runtime-<tag>.zip, built once and verified by
    # Softn's release workflow. This fetches the latest release (or the tag
    # named by the input), checks the archive against its .sha256 and its own
    # manifest, checks it fits THIS tree (identical ZIPP engine bytes, the same
    # protocol versions, the adapter this tree has vendored) and installs it
    # where the build, the tests and the packagers expect it. Nothing is
    # built from Softn source here.
    - name: Fetch and install the Softn release runtime
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SOFTN_RELEASE: ${{ inputs.softn-release }}
        SOFTN_FROZEN: ${{ inputs.frozen-release }}
      run: node scripts/fetch-softn-release.mjs
    - name: Verify the hosted runtime and editors
      if: inputs.native-only != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/formlogic/ui
      run: |
        npm run test:hosted-runtime
        node scripts/check-hosted-runtime.mjs
        node scripts/check-app-editors.mjs
    - name: Name the Node the native runtime tests run with
      shell: bash
      run: echo "FORMLOGIC_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
    # ECO-02: every consumer of the runtime (backend tests, UI, e2e, packaging)
    # asserts that the committed compatibility manifest describes THIS tree:
    # the vendored ZIPP release (identical bytes in FormLogic and in the
    # installed runtime), the vendored adapter's provenance against the
    # release's adapter, protocol versions and data-format ranges. Which
    # Softn release is installed is recorded, not pinned: it moves with every
    # Softn release, and a release that does not fit fails the fetch above.
    # With a frozen record (release-readiness FL-S01) the check is also exact:
    # what is installed IS the release this run resolved, not merely one that fits.
    - name: Ecosystem compatibility manifest (digests, protocols)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOFTN_FROZEN: ${{ inputs.frozen-release }}
      run: node scripts/ecosystem-manifest.mjs --check ${{ inputs.frozen-release != '' && '--exact' || '' }}
