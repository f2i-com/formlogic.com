name: Build pinned app runtime and editors
description: Build and verify the compatible Softn runtime from a clean source checkout
inputs:
  native-only:
    description: Prepare only the native backend runtime for PHP tests
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: f2i-com/softn.com
        ref: 5f9330f342c55cd7ff8ff2ea9c20cde2c005076a
        path: .runtime-source/softn.com
        persist-credentials: false
    - name: Install pinned runtime dependencies
      if: inputs.native-only != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/.runtime-source/softn.com
      run: npm ci
    - name: Build and verify hosted runtime
      if: inputs.native-only != 'true'
      shell: bash
      working-directory: ${{ github.workspace }}/formlogic/ui
      env:
        SOFTN_REPO: ${{ github.workspace }}/.runtime-source/softn.com
      run: |
        npm run build:hosted-runtime
        npm run test:hosted-runtime
        npm run build:app-editors
        node scripts/check-app-editors.mjs
    - name: Prepare native runtime and test runner
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOFTN_REPO: ${{ github.workspace }}/.runtime-source/softn.com
      run: |
        node scripts/prepare-native-runtime.mjs
        echo "FORMLOGIC_NODE_BIN=$(command -v node)" >> "$GITHUB_ENV"
    # ECO-02: every consumer of the pinned runtime (backend tests, UI, e2e,
    # packaging) asserts that the committed compatibility manifest describes
    # THIS tree: the pinned Softn revision, its pinned XDB revision, the
    # vendored ZIPP release (identical bytes in FormLogic, Softn and the
    # prepared native runtime), the vendored adapter's provenance, protocol
    # versions and data-format ranges. A stale manifest, a drifted pin or
    # mismatched engine bytes fail here before any test or package step.
    - name: Ecosystem compatibility manifest (pins, digests, protocols)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOFTN_REPO: ${{ github.workspace }}/.runtime-source/softn.com
      run: node scripts/ecosystem-manifest.mjs --check
